<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Minimal — Preview</title>
<style>
@font-face { font-family: DSEG7; font-weight: 700; src: url('assets/480x480-amazfit-t-rex-3/fonts/fonts-DSEG_v046/DSEG7-Classic/DSEG7Classic-Bold.ttf'); }
@font-face { font-family: DSEG14; font-weight: 700; src: url('assets/480x480-amazfit-t-rex-3/fonts/fonts-DSEG_v046/DSEG14-Classic/DSEG14Classic-Bold.ttf'); }
@font-face { font-family: DSEG14; font-weight: 400; src: url('assets/480x480-amazfit-t-rex-3/fonts/fonts-DSEG_v046/DSEG14-Classic/DSEG14Classic-Regular.ttf'); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-content: center; background: #171a18; }
.controls { display: flex; gap: 12px; justify-content: center; margin: 24px 0; font: 14px system-ui; color: #ddd; }
select, button { background: #252c26; color: #eee; border: 1px solid #526353; border-radius: 5px; padding: 8px; }
.face { width: 480px; height: 480px; position: relative; border-radius: 50%; overflow: hidden; background: #000; box-shadow: 0 0 0 2px #313831; font-family: DSEG7, sans-serif; }
.text { position: absolute; display: flex; align-items: center; justify-content: center; line-height: 1; font-weight: 400; }
.time { left: 32px; top: 95px; width: 416px; height: 205px; font: 700 115px/1 DSEG7, sans-serif; color: #75ff69; }
.bpm { left: 80px; top: 368px; width: 128px; height: 76px; font: 700 44px/1 DSEG7, sans-serif; color: #ff4949; }
.date { left: 32px; top: 280px; width: 416px; height: 76px; font: 700 48px/1 DSEG14, sans-serif; color: #ffa044; white-space: pre; }
.date { gap: 18px; }
.date span { display: inline-flex; justify-content: center; }
.date-word { width: 118px; font-weight: 400; }
.date-number { width: 80px; font-family: DSEG7, sans-serif; font-weight: 700; }
.level { left: 236px; top: 368px; width: 160px; height: 76px; font: 700 44px/1 DSEG7, sans-serif; color: #6bde76; }
.percent { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 36px; margin-left: 4px; font: 700 44px/1 DSEG14, sans-serif; }
@media (max-width: 500px) { .face { zoom: .72; } }
</style>
<div class="face" role="img" aria-label="Green Minimal: time 10:09, Thursday 12 November, heart rate 72, battery 82 percent">
  <div class="text time">10:09</div>
  <div class="text bpm">72</div>
  <div class="text date"><span class="date-word weekday">THU</span><span class="date-number">12</span><span class="date-word month">NOV</span></div>
  <div class="text level"><span class="battery-number">82</span><span class="percent">%</span></div>
</div>
<div class="controls">
  <select id="sample" aria-label="Sample values">
    <option value="normal">Normal</option>
    <option value="wide">Long values</option>
    <option value="missing">No heart rate</option>
    <option value="midnight">New year / midnight</option>
  </select>
  <img src="icon.svg" width="40" height="40" alt="Green hollow triangle icon">
</div>
<script>
const samples = {
  normal: ['10:09', '72', 'THU 12 NOV', '82%'],
  wide: ['23:59', '199', 'WED 28 AUG', '100%'],
  missing: ['08:08', '--', 'THU 08 AUG', '1%'],
  midnight: ['00:00', '60', 'FRI 01 JAN', '99%'],
}
document.querySelector('#sample').addEventListener('change', (event) => {
  const values = samples[event.target.value]
  ;['time', 'bpm', 'date', 'level'].forEach((name, i) => {
    if (name === 'level') {
      document.querySelector('.battery-number').textContent = values[i].replace('%', '')
    } else if (name === 'date') {
      const parts = values[i].split(' ')
      document.querySelector('.weekday').textContent = parts[0]
      document.querySelector('.date-number').textContent = parts[1]
      document.querySelector('.month').textContent = parts[2]
    } else {
      document.querySelector('.' + name).textContent = values[i]
    }
  })
  document.querySelector('.face').setAttribute('aria-label', 'Watch face preview: ' + values.join(', '))
})
const params = new URLSearchParams(location.search)
if (samples[params.get('sample')]) {
  document.querySelector('#sample').value = params.get('sample')
  document.querySelector('#sample').dispatchEvent(new Event('change'))
}
</script>
</html>
