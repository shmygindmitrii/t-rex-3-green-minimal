<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD Minimal Preview</title>
<script type="importmap">
{ "imports": {
  "@zos/ui": "/preview/zos-browser.js",
  "@zos/sensor": "/preview/zos-browser.js",
  "@zos/app": "/preview/zos-browser.js",
  "@zos/user": "/preview/zos-browser.js"
} }
</script>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 20px; padding: 24px 16px; background: #171a18; color: #ddd; font: 14px system-ui, sans-serif; }
.stage { position: relative; justify-self: center; }
#face { position: relative; overflow: hidden; border-radius: 50%; box-shadow: 0 0 0 2px #313831; }
.widget { position: absolute; display: flex; line-height: 1; white-space: pre; overflow: hidden; }
.guides .widget-text { outline: 1px dashed #4a6dff88; }
.guide { position: absolute; pointer-events: none; display: none; }
.guides .guide { display: block; }
.guide.v { top: 0; bottom: 0; width: 0; border-left: 1px dashed #ff40ff99; }
.guide.h { left: 0; right: 0; height: 0; border-top: 1px dashed #40ffff66; }
.edit-area { position: absolute; display: none; pointer-events: none; outline: 1px dashed #ffd60a99; }
.guides .edit-area { display: block; }
/* ?shot=1: only the face at the top left, for tools/make-icon.mjs */
.shot { display: block; padding: 0; background: #000; }
.shot .controls, .shot #metrics { display: none; }
.shot #face { box-shadow: none; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
select, label { background: #252c26; color: #eee; border: 1px solid #526353; border-radius: 5px; padding: 6px 8px; }
#metrics { font: 12px ui-monospace, monospace; color: #9fb39f; text-align: center; white-space: pre; margin: 0; }
@media (max-width: 520px) { .stage { zoom: .7; } }
</style>
<div class="stage" id="stage"><div id="face"></div></div>
<div class="controls">
  <select id="sample" aria-label="Sample values">
    <option value="normal">Normal</option>
    <option value="wide">Long values</option>
    <option value="missing">No heart rate</option>
    <option value="midnight">New year / midnight</option>
    <option value="warning">Elevated HR / half battery</option>
    <option value="alert">High HR / low battery</option>
  </select>
  <select id="scheme" aria-label="Color scheme (watch edit mode)"></select>
  <select id="ghost" aria-label="Ghost level (watch edit mode)"></select>
  <label><input type="checkbox" id="guides"> Guides</label>
</div>
<pre id="metrics"></pre>
<script>
// Live reload from preview/server.mjs. Registered before the face code runs, so a
// broken config.js still reloads once it is fixed. Off for screenshots (?shot=1),
// where an open connection would keep the page loading forever.
if (new URLSearchParams(location.search).get('shot') === '1') document.body.classList.add('shot')
else new EventSource('/__reload').onmessage = () => location.reload()
</script>
<script type="module">
import { mock } from '/preview/zos-browser.js'
const config = await import('/watchface/config.js')
const edit = await import('/watchface/edit.js')
const params = new URLSearchParams(location.search)

// Edit-mode choices, as if picked on the watch: ?scheme=cyan&ghost=10 (percent).
const schemeOption = edit.OPTIONS.scheme.find((o) => o.title_en.toLowerCase() === params.get('scheme'))
const ghostOption = edit.OPTIONS.ghost.find((o) => '' + Math.round(o.level * 100) === params.get('ghost'))
if (schemeOption) mock.edit[config.EDIT.scheme.id] = schemeOption.type
if (ghostOption) mock.edit[config.EDIT.ghost.id] = ghostOption.type

const face = document.querySelector('#face')
face.style.width = config.SCREEN.width + 'px'
face.style.height = config.SCREEN.height + 'px'

let definition
globalThis.WatchFace = (value) => { definition = value }
await import('/watchface/index.js')
definition.build()

// Guides: screen center cross and each line's center.
const guide = (cls, prop, value) => {
  const el = document.createElement('div')
  el.className = 'guide ' + cls
  el.style[prop] = value + 'px'
  face.append(el)
}
guide('v', 'left', config.CX)
guide('h', 'top', config.CY)
config.LINES.forEach((line) => guide('h', 'top', line.y))

const samples = {
  normal: { hour: 10, minute: 9, day: 4, date: 12, month: 11, bpm: 72, battery: 82 },
  wide: { hour: 23, minute: 59, day: 3, date: 28, month: 8, bpm: 199, battery: 100 },
  missing: { hour: 8, minute: 8, day: 4, date: 8, month: 8, bpm: 0, battery: 1 },
  midnight: { hour: 0, minute: 0, day: 5, date: 1, month: 1, bpm: 60, battery: 99 },
  warning: { hour: 18, minute: 45, day: 6, date: 14, month: 11, bpm: 142, battery: 45 },
  alert: { hour: 7, minute: 30, day: 7, date: 15, month: 11, bpm: 172, battery: 12 },
}
// Round display: report items whose glyph box corners fall outside the circle.
const radius = Math.min(config.SCREEN.width, config.SCREEN.height) / 2
const outside = (line, m) => m.items.filter(({ item, x, w }) => {
  const half = item.size / 2
  const cy = line.y + (item.dy || 0)
  return [x, x + w].some((px) => [cy - half, cy + half].some((py) =>
    Math.hypot(px - config.CX, py - config.CY) > radius))
}).map(({ item }) => item.id)
const showMetrics = () => {
  document.querySelector('#metrics').textContent = config.LINES
    .filter((line) => line.show !== false)
    .map((line) => {
      const m = definition.ui.measure(line.id)
      const out = outside(line, m)
      return `${line.id.padEnd(6)} y=${line.y}  width=${m.width.toFixed(1)}  x=${m.x}..${Math.round(m.x + m.width)}` +
        (out.length ? `  ⚠ outside round screen: ${out.join(', ')}` : '')
    })
    .join('\n') + `\nscreen ${config.SCREEN.width}x${config.SCREEN.height}` +
    Object.entries(config.COLOR_RULES).map(([name, { rules }]) => `\n${name} colors: ` +
      rules.map((r) => (r.below !== undefined ? `<${r.below}` : `>=${r.atLeast}`) + ' ' + r.color).join(', ') +
      (name === 'heartRate' ? `  (profile age ${mock.profile.age}, ?age= to change)` : '')).join('') +
    `
edit mode: scheme ${edit.schemeFor(mock.edit[config.EDIT.scheme.id]).name}, ghost ${Math.round(definition.theme.ghost * 100)}%`
}
const apply = (name) => {
  Object.assign(mock.readings, samples[name])
  mock.listeners.minute()
  showMetrics()
}

const sample = document.querySelector('#sample')
const guides = document.querySelector('#guides')
sample.value = samples[params.get('sample')] ? params.get('sample') : 'normal'
guides.checked = params.get('guides') === '1'
face.classList.toggle('guides', guides.checked)
apply(sample.value)

const setParam = (key, value) => {
  const url = new URL(location.href)
  url.searchParams.set(key, value)
  history.replaceState(null, '', url)
}
// Edit-mode selectors: the watch restarts the face after a choice, so reload too.
const fillSelect = (el, options, value, key) => {
  options.forEach(({ label, param }) => el.add(new Option(label, param)))
  el.value = value
  el.addEventListener('change', () => { setParam(key, el.value); location.reload() })
}
const selected = (key) => edit.OPTIONS[key].find((o) => o.type === (mock.edit[config.EDIT[key].id] ?? edit.DEFAULT_TYPE[key]))
fillSelect(document.querySelector('#scheme'),
  edit.OPTIONS.scheme.map((o) => ({ label: o.title_en, param: o.title_en.toLowerCase() })),
  selected('scheme').title_en.toLowerCase(), 'scheme')
fillSelect(document.querySelector('#ghost'),
  edit.OPTIONS.ghost.map((o) => ({ label: o.title_en, param: '' + Math.round(o.level * 100) })),
  '' + Math.round(selected('ghost').level * 100), 'ghost')
sample.addEventListener('change', () => { apply(sample.value); setParam('sample', sample.value) })
guides.addEventListener('change', () => { face.classList.toggle('guides', guides.checked); setParam('guides', guides.checked ? 1 : 0) })
</script>
</html>
